name: Telegram bot

# Applies what the owner sends to the Telegram bot (products, prices, stock,
# "روح الفريق" photos) to the site and republishes it.
# While LISTEN_UNTIL has not passed, each run keeps listening for hours, so a
# change is picked up within seconds; the schedule only starts the next run.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Listen to the bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LISTEN_MINUTES: '330'
          LISTEN_UNTIL: '2026-11-30'
        run: node scripts/telegram-bot.mjs
